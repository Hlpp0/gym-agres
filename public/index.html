<style>
/* Minimal type Notion : fond blanc, texte gris foncé, séparateurs fins, une seule couleur d'accent pour les statuts. Layout mobile d'abord : contenu en colonne, barre d'onglets en bas. */
:root{
  --bg:#ffffff; --soft:#f7f7f5; --hover:#efefed; --ink:#37352f; --muted:#787774; --line:#e9e9e7;
  --s1:#fbf3db; --s1i:#956400; --s2:#fdecc8; --s2i:#8a5a00; --s3:#dbeddb; --s3i:#2b593f; --s4:#2b593f; --s4i:#ffffff;
  --font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#191919; --soft:#202020; --hover:#2a2a2a; --ink:#e6e6e4; --muted:#9b9a97; --line:#2f2f2f;
  --s1:#3f3420; --s1i:#e0b85c; --s2:#4a3520; --s2i:#f0a860; --s3:#253a2c; --s3i:#8fd1a5; --s4:#4f9768; --s4i:#0f1a12; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#191919; --soft:#202020; --hover:#2a2a2a; --ink:#e6e6e4; --muted:#9b9a97; --line:#2f2f2f;
  --s1:#3f3420; --s1i:#e0b85c; --s2:#4a3520; --s2i:#f0a860; --s3:#253a2c; --s3i:#8fd1a5; --s4:#4f9768; --s4i:#0f1a12; color-scheme:dark;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;text-wrap:balance}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:18px}
h3{font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid #2383e2;outline-offset:2px;border-radius:4px}
.wrap{max-width:720px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));display:grid;gap:20px}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.head .sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sec{display:grid;gap:4px}
.sec>.label{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em;padding:8px 4px 4px}
.li{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:6px;width:100%;text-align:left;min-height:48px}
button.li:hover,button.li:active{background:var(--hover)}
.li .grow{flex:1;min-width:0}
.li .t{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.li .d{display:block;font-size:13px;color:var(--muted)}
.chev{color:var(--muted)}
.divide>*+*{border-top:1px solid var(--line)}
.pillbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.pill{border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;white-space:nowrap;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:1px solid var(--line);border-radius:6px;padding:8px 14px;font-size:15px;font-weight:500;min-height:40px;background:var(--bg)}
.btn:active{background:var(--hover)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.link{border:0;color:var(--muted);padding:8px 4px}
.btn.danger{color:#d44c47}
.inp,.sel{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:var(--bg);min-height:42px;width:100%}
textarea.inp{min-height:120px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted)}
label.f>*{color:var(--ink);font-size:16px}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.box{background:var(--soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.st{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;border-radius:6px;font-weight:600;font-size:14px;background:var(--soft);color:var(--muted)}
.st1{background:var(--s1);color:var(--s1i)} .st2{background:var(--s2);color:var(--s2i)} .st3{background:var(--s3);color:var(--s3i)} .st4{background:var(--s4);color:var(--s4i)}
.pick{display:flex;gap:4px;flex-shrink:0}
.pick button{min-width:38px;height:38px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted);border:1px solid var(--line)}
.pick button[aria-pressed="true"].p0{background:var(--hover);color:var(--ink);border-color:var(--muted)}
.pick button[aria-pressed="true"].p1{background:var(--s1);color:var(--s1i);border-color:transparent}
.pick button[aria-pressed="true"].p2{background:var(--s2);color:var(--s2i);border-color:transparent}
.pick button[aria-pressed="true"].p3{background:var(--s3);color:var(--s3i);border-color:transparent}
.pick button[aria-pressed="true"].p4{background:var(--s4);color:var(--s4i);border-color:transparent}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .st{min-width:22px;height:22px;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.b3{background:var(--s3i)} .b4{background:var(--s4)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;max-width:180px;text-align:center;padding:10px 4px 12px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600;display:grid;gap:2px;justify-items:center}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs a[aria-current="page"]{color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;padding:6px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:8px}
.banner{background:var(--s1);color:var(--s1i);padding:8px 12px;border-radius:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:14px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(15,15,15,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal>section{background:var(--bg);border-radius:10px;padding:20px;width:min(400px,100%);display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.tl{display:grid;gap:14px}
.tl .slot{display:grid;grid-template-columns:56px 1fr;gap:10px}
.tl time{font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--hover);color:var(--muted);margin-right:4px}
svg.ch text{fill:var(--muted);font:11px var(--font)}
.nm{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function needs(g){ const out=[]; for(const e of elements()){ if(!forGym(e,g)) continue; const s=stOf(g,e.id); if(s>=3) continue; const miss=(PRE[e.id]||[]).filter(p=>!preOk(g,p)); out.push({e,s,ready:!miss.length,miss}); } out.sort((a,b)=>(b.ready-a.ready)||((b.s>0)-(a.s>0))||(b.s-a.s)||(minCat(a.e)-minCat(b.e))); return out; }
function progress(g){ const els=elements().filter(e=>forGym(e,g)); const done=els.filter(e=>stOf(g,e.id)>=3).length; return {done,total:els.length,pct:els.length?Math.round(done/els.length*100):0}; }
function workGroups(list,max){ const b={},free=[]; for(const g of list){ const n=needs(g).filter(x=>x.ready); if(!n.length){ free.push(g); continue; } (b[n[0].e.id]=b[n[0].e.id]||[]).push(g); } const out=[]; for(const [eid,l] of Object.entries(b)) for(let i=0;i<l.length;i+=max) out.push({eid,gyms:l.slice(i,i+max)}); out.sort((a,b)=>b.gyms.length-a.gyms.length||minCat(BY[a.eid])-minCat(BY[b.eid])); if(free.length) out.push({eid:null,gyms:free}); return out; }

function buildPlan(o){
  const list=gyms(); const t0=toMin(o.start); const main=Math.max(10,o.dur-o.warm-o.cool);
  const wg=workGroups(list,S.maxSize); const coaches=o.coaches;
  const stations=wg.map((w,i)=>({eid:w.eid,names:w.gyms.map(g=>g.name),coach:coaches.length?coaches[i%coaches.length]:"",postes:w.eid?postesFor(w.eid):["Perfectionnement ou préparation physique"]}));
  const blocks=[]; let t=t0;
  if(o.warm){ blocks.push({t:toHM(t),dur:o.warm,title:"Échauffement",detail:"Mobilisation, poignets, gainage I / C+ / C−, appuis.",stations:[]}); t+=o.warm; }
  blocks.push({t:toHM(t),dur:main,title:"Travail par groupes de besoin",detail:o.rot?`Chaque groupe enchaîne ses ateliers et change toutes les ${o.rot} min. Termine par l'élément complet.`:"Chaque groupe enchaîne ses ateliers et termine par l'élément complet.",stations}); t+=main;
  if(o.cool) blocks.push({t:toHM(t),dur:o.cool,title:"Retour au calme",detail:"Souplesse active, bilan rapide.",stations:[]});
  return {...o,groupId:S.groupId,apps:["sol"],blocks,created:new Date().toISOString()};
}

function exportBdns(){
  const date=S.presDate||today(); const month=date.slice(0,7); const gr=S.groups[S.groupId]||{};
  const coachMap={}; (S.members[gr.clubId]||[]).forEach(m=>{ if(typeof m!=="string") coachMap[m.name]=m.bdns||""; });
  const fmt=d=>d.split("-").reverse().join(".");
  const rows=[["N° PERSONNEL","FONCTION","DATE","TYPE D'ACTIVITE","HEURE","DUREE","LIEU"]]; const missing=new Set();
  const sessions=Object.values(S.attendance).filter(x=>x.groupId===S.groupId&&String(x.date).startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
  for(const s of sessions){
    for(const [name,on] of Object.entries(s.coaches||{})){ if(!on) continue; const n=coachMap[name]; if(!n){ missing.add(name); continue; } rows.push([n,"Moniteur",fmt(s.date),"Entraînement",s.start||"",String(s.dur||""),s.lieu||""]); }
    for(const [gid,on] of Object.entries(s.present||{})){ if(!on) continue; const g=S.gymnasts[gid]; if(!g) continue; if(!g.bdns){ missing.add(g.name); continue; } rows.push([g.bdns,"Participant",fmt(s.date),"Entraînement",s.start||"",String(s.dur||""),s.lieu||""]); }
  }
  if(rows.length===1){ S.csvWarn="Aucune présence avec N° BDNS ce mois-ci."; S.lastCsv=""; render(); return; }
  const csv=rows.map(r=>r.map(v=>/[;"\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(";")).join("\r\n");
  S.lastCsv=csv; S.csvWarn=missing.size?`Ignorés faute de N° BDNS : ${[...missing].join(", ")}`:"";
  try{ const b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}); const u=URL.createObjectURL(b); const l=document.createElement("a"); l.href=u; l.download=`presences-${(gr.name||"groupe").replace(/[^\w-]+/g,"_")}-${month}.csv`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }catch(e){}
  render();
}

function chart(g){
  const log=Object.entries(g.log||{}).map(([k,v])=>({k,...v})).filter(l=>BY[l.e]&&BY[l.e].a==="sol").sort((a,b)=>(a.d+a.k).localeCompare(b.d+b.k));
  if(log.length<2) return "";
  const cur={},pts=[]; for(const l of log){ cur[l.e]=l.s; const n=Object.values(cur).filter(s=>s>=3).length; const last=pts[pts.length-1]; if(last&&last.d===l.d) last.n=n; else pts.push({d:l.d,n}); }
  if(pts.length<2) return "";
  const W=600,H=120,P=24,max=Math.max(3,...pts.map(p=>p.n)); const x=i=>P+i*(W-2*P)/(pts.length-1), y=v=>H-P-(v/max)*(H-2*P);
  const line=pts.map((p,i)=>`${i?"L":"M"}${x(i).toFixed(1)},${y(p.n).toFixed(1)}`).join(" ");
  return `<div class="sec"><div class="label">Éléments acquis dans le temps</div><svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Progression"><line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/><path d="${line} L${x(pts.length-1)},${H-P} L${x(0)},${H-P} Z" fill="var(--s3)" opacity=".6"/><path d="${line}" fill="none" stroke="var(--s3i)" stroke-width="2"/><circle cx="${x(pts.length-1)}" cy="${y(pts[pts.length-1].n)}" r="4" fill="var(--s3i)"/><text x="${P}" y="${H-6}">${fmtDate(pts[0].d)}</text><text x="${W-P}" y="${H-6}" text-anchor="end">${fmtDate(pts[pts.length-1].d)} · ${pts[pts.length-1].n}</text></svg></div>`;
}

function render(){

  const {r,id}=parse();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+r?"page":"false"));
  if(S.mode==="login"){ document.getElementById("tabs").hidden=true; const fa=document.activeElement&&document.activeElement.id; if(fa&&/^(li|su)/.test(fa)) return; V.innerHTML=vAuth(); return; }
  document.getElementById("tabs").hidden=false;
  if(S.mode==="loading"){ V.innerHTML=`<div class="empty">Chargement…</div>`; return; }
  if(!entries.length&&!(r==="gymnastes"&&(id==="admin"||id==="reglages"))){ V.innerHTML=`${banner()}<h1>GETUMA Coach</h1><div class="empty">${isAdmin()?`Commence par créer une société et un groupe.<br><br><button class="btn primary" data-go="gymnastes--admin">Ouvrir l'administration</button>`:`Ton compte n'est rattaché à aucun groupe pour l'instant. Demande à l'administrateur de t'ajouter à ta société.<br><br><button class="btn" data-go="gymnastes--reglages">Mon compte</button>`}</div>`; return; }
  const ae=document.activeElement, aid=ae&&ae.id, sy=window.scrollY;
  const typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&ae.type!=="checkbox"; if(typing&&(aid==="gNote"||aid==="bulkIn"||aid==="gBdns"||aid==="pfBdns"||aid==="presLieu"||aid==="gName"||aid==="newClubIn"||aid==="pwCur"||aid==="pwNew"||ae.closest("form[data-newgroup]")||ae.dataset.clubname)) return; /* ne pas écraser une saisie en cours */
  V.innerHTML=({evaluer:vEvaluer,groupes:vGroupes,seance:vSeance,presences:vPresences,gymnastes:vGymnastes})[r](id);
  window.scrollTo(0,sy);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.set){ const [gid,eid,s]=t.dataset.set.split("|"); const cur=stOf(S.gymnasts[gid],eid); if(+s!==cur) setStatus(gid,eid,+s); return; }
  if(t.id==="syncNow"){ pull().then(()=>toast(S.syncErr?"Pas de réseau":"Synchronisé")); return; }
  if(t.id==="logout"){ confirmBox(OUTBOX.length?"Des modifications ne sont pas encore envoyées. Se déconnecter quand même ?":"Se déconnecter de ce téléphone ?","Se déconnecter",()=>{ call("/api/auth/logout","POST").catch(()=>{}); wipeLocal(); S.admin=null; toLogin(); }); return; }
  if(t.dataset.auth){ S.authView=t.dataset.auth; S.authErr=""; render(); return; }
  if(t.dataset.delclub){ const cid=t.dataset.delclub; const n=Object.values(S.groups).filter(g=>g.clubId===cid).length; if(n){ toast("Supprime d'abord les groupes de cette société"); return; } confirmBox(`Supprimer la société ${S.clubs[cid]?.name||""} ?`,"Supprimer",()=>store.del("clubs",cid)); return; }
  if(t.dataset.delgroup){ const gid=t.dataset.delgroup; const n=Object.values(S.gymnasts).filter(g=>gGroups(g).includes(gid)).length; confirmBox(n?`Supprimer ce groupe ? Ses ${n} gymnastes ne seront plus visibles.`:"Supprimer ce groupe ?","Supprimer",()=>{ store.del("groups",gid); if(S.groupId===gid) S.groupId=null; }); return; }
  if(t.dataset.renamegroup){ const gid=t.dataset.renamegroup; const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<section role="dialog" aria-modal="true"><label class="f" for="rnIn">Nom du groupe<input class="inp" id="rnIn" value="${esc(S.groups[gid]?.name||"")}"></label><div class="row" style="justify-content:flex-end"><button class="btn" data-no>Annuler</button><button class="btn primary" data-yes>Renommer</button></div></section>`; m.addEventListener("click",e=>{ if(e.target===m||e.target.closest("[data-no]")) m.remove(); if(e.target.closest("[data-yes]")){ const v=$("#rnIn",m).value.trim().slice(0,60); m.remove(); if(v) store.patch("groups",gid,{name:v}); } }); document.body.appendChild(m); return; }
  if(t.dataset.uact){ const [u,act]=t.dataset.uact.split("|"); const usr=(S.admin&&S.admin.users||[]).find(x=>x.uid===u)||{};
    if(act==="activate") adminAction({action:"update",uid:u,status:"active"},"Compte validé");
    else if(act==="disable") adminAction({action:"update",uid:u,status:"disabled"},"Compte désactivé");
    else if(act==="admin"||act==="coach") confirmBox(act==="admin"?`Donner les droits d'administrateur à ${usr.name} ? Il pourra tout voir et tout modifier.`:`Retirer les droits d'administrateur à ${usr.name} ?`,"Confirmer",()=>adminAction({action:"update",uid:u,role:act},"Rôle modifié"));
    else if(act==="reset") confirmBox(`Générer un nouveau mot de passe pour ${usr.name} ? L'ancien ne marchera plus.`,"Générer",async()=>{ const d=await adminAction({action:"resetPassword",uid:u}); if(d&&d.password) infoBox(`<b>Nouveau mot de passe de ${esc(usr.name)}</b><p style="font:600 20px ui-monospace,monospace;margin:0;user-select:all">${esc(d.password)}</p><p class="small muted" style="margin:0">Transmets-le-lui directement. Il pourra le changer dans Réglages › Mon compte. Ce mot de passe ne sera plus affiché.</p>`); });
    else if(act==="delete") confirmBox(`Supprimer le compte de ${usr.name} ?`,"Supprimer",()=>adminAction({action:"delete",uid:u},"Compte supprimé"));
    return; }
  if(t.dataset.go){ go(...t.dataset.go.split("--")); return; }
  if(t.dataset.fam){ S.fam=t.dataset.fam; render(); return; }
  if(t.dataset.max){ S.maxSize=+t.dataset.max; saveUi(); render(); return; }
  if(t.dataset.level){ S.level=t.dataset.level; saveUi(); render(); return; }

document.addEventListener("submit",e=>{
  e.preventDefault(); const f=e.target;
  if(f.id==="bulkForm"){ const names=$("#bulkIn").value.split(/\n|,/).map(s=>s.trim()).filter(Boolean).slice(0,60); const cat=$("#bulkCat").value; $("#bulkIn").blur(); (async()=>{ for(const n of names) await store.set("gymnasts",uid(),{name:n.slice(0,40),cat,groupIds:[S.groupId],groupId:S.groupId,st:{},log:{},created:today()}); })(); toast(`${names.length} ajouté${names.length>1?"s":""}`); go("gymnastes"); }
  if(f.id==="loginForm"){ const email=$("#liEmail").value.trim(), password=$("#liPw").value; document.activeElement.blur(); S.authErr=""; call("/api/auth/login","POST",{email,password}).then(r=>{ if(r.ok){ wipeLocal(); S.me=r.d.user; S.mode="loading"; saveCache(); render(); pull(); } else { S.authErr=r.d.error==="pending"?"":r.d.error==="locked"?"Trop d'essais. Réessaie dans 15 minutes.":r.d.error==="disabled"?"Ce compte est désactivé.":"E-mail ou mot de passe incorrect."; if(r.d.error==="pending") S.authView="pending"; render(); } }).catch(()=>{ S.authErr="Pas de réseau."; render(); }); return; }
  if(f.id==="signupForm"){ const name=$("#suName").value.trim(), email=$("#suEmail").value.trim(), password=$("#suPw").value; document.activeElement.blur(); S.authErr=""; call("/api/auth/signup","POST",{name,email,password}).then(r=>{ if(r.ok){ if(r.d.user.status==="active"){ wipeLocal(); S.me=r.d.user; S.mode="loading"; saveCache(); render(); pull(); } else { S.authView="pending"; render(); } } else { S.authErr=r.d.error==="exists"?"Un compte existe déjà avec cet e-mail.":r.d.error==="password"?"Le mot de passe doit faire au moins 10 caractères.":r.d.error==="email"?"E-mail invalide.":"Création impossible pour le moment."; render(); } }).catch(()=>{ S.authErr="Pas de réseau."; render(); }); return; }
  if(f.id==="linkForm"){ const gid=$("#linkSel").value; const cur=gGroups(S.gymnasts[gid]); store.patch("gymnasts",gid,{groupIds:[...new Set([...cur,S.groupId])]}); toast("Gymnaste ajouté au groupe"); go("gymnastes"); return; }
  if(f.id==="profileForm"){ const bdns=$("#pfBdns").value.replace(/\D/g,"").slice(0,12); document.activeElement.blur(); call("/api/auth/profile","POST",{bdns}).then(r=>{ if(r.ok){ S.me=r.d.user; saveCache(); toast("Profil enregistré"); render(); pull(); } else toast("Enregistrement impossible"); }); return; }
  if(f.id==="pwForm"){ const current=$("#pwCur").value, next=$("#pwNew").value; document.activeElement.blur(); call("/api/auth/password","POST",{current,next}).then(r=>{ toast(r.ok?"Mot de passe modifié":r.d.error==="invalid"?"Mot de passe actuel incorrect":"Le nouveau mot de passe doit faire 10 caractères minimum"); if(r.ok) render(); }); return; }
  if(f.id==="newClubForm"){ const v=$("#newClubIn").value.trim().slice(0,60); $("#newClubIn").blur(); if(v){ store.set("clubs",uid(),{name:v}); } return; }
  if(f.dataset.newgroup){ const inp=f.querySelector("input"); const v=inp.value.trim().slice(0,60); inp.blur(); if(v){ const gid=uid(); store.set("groups",gid,{name:v,clubId:f.dataset.newgroup,apps:["sol"]}); toast("Groupe créé"); } return; }
  if(f.id==="planForm"){ S.plan=buildPlan({date:$("#pDate").value,start:$("#pStart").value||"18:00",dur:+$("#pDur").value||90,warm:+$("#pWarm").value||0,cool:+$("#pCool").value||0,rot:+$("#pRot").value||0,coaches:[...document.querySelectorAll("[data-coach]")].filter(x=>x.checked).map(x=>x.dataset.coach)}); go("seance","nouvelle"); }
});
window.addEventListener("hashchange",()=>{ window.scrollTo(0,0); if(location.hash==="#gymnastes--admin") S.admin=null; render(); });

/* ---------- démarrage ---------- */
(()=>{ const c=LS.get("getuma-cache",null); if(c&&S.me){ Object.assign(S,{clubs:c.clubs||{},groups:c.groups||{},gymnasts:c.gymnasts||{},sessions:c.sessions||{},attendance:c.attendance||{},members:c.members||{}}); S.mode="shared"; } for(const op of OUTBOX) applyLocal(op); })();
if(!S.me) S.mode="login";
render();
if(navigator.onLine) call("/api/auth/me","GET").then(r=>{ if(r.status===401){ wipeLocal(); toLogin(); } else if(r.ok){ S.me=r.d.user; if(S.mode==="login") S.mode="loading"; saveCache(); render(); pull(); } }).catch(()=>{});
setInterval(()=>{ if(document.visibilityState==="visible") pull(); },20000);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pull(); });
window.addEventListener("online",()=>{ render(); pull(); });
window.addEventListener("offline",render);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
</html>
