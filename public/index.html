const S={extra:false,content:{},ed:null,engin:ENGINS.some(x=>x[0]===S0_ENGIN)?S0_ENGIN:"sol",clubs:{},groups:{},gymnasts:{},sessions:{},attendance:{},members:{},presDate:null,me:null,authView:"login",groupId:null,level:"base",fam:"Tous",maxSize:6,mode:"loading",canWrite:true,plan:null,showAll:false};

/* ---------- stockage : cache local + file d'attente + API ---------- */
const LS={get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }};
let OUTBOX=LS.get("getuma-outbox",[]); let flushing=false; S.lastSync=LS.get("getuma-lastsync",null); S.me=LS.get("getuma-me",null);
function deepMerge(a,b){ const o={...(a||{})}; for(const k in b){ const v=b[k]; o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))?deepMerge(o[k],v):v; } return o; }
function applyLocal(op){ const c={...S[op.col]}; if(op.op==="del") delete c[op.id]; else c[op.id]=op.op==="patch"?deepMerge(c[op.id],op.data):op.data; S[op.col]=c; }
const saveCache=()=>{ LS.set("getuma-cache",{content:S.content,clubs:S.clubs,groups:S.groups,gymnasts:S.gymnasts,sessions:S.sessions,attendance:S.attendance,members:S.members}); LS.set("getuma-me",S.me); };
let _sc=0; const saveCacheSoon=()=>{ clearTimeout(_sc); _sc=setTimeout(saveCache,400); };
function queue(op){ op.qid=uid(); applyLocal(op); OUTBOX.push(op); render(); setTimeout(()=>{ LS.set("getuma-outbox",OUTBOX); saveCacheSoon(); flush(); },0); }
const store={ set:(col,id,data)=>queue({op:"set",col,id,data}), patch:(col,id,data)=>queue({op:"patch",col,id,data}), del:(col,id)=>queue({op:"del",col,id}) };
const isAdmin=()=>S.me&&S.me.role==="admin";
async function call(url,method,body){ const r=await fetch(url,{method,credentials:"same-origin",headers:{"x-getuma":"1","content-type":"application/json"},body:body?JSON.stringify(body):undefined,cache:"no-store"}); let d={}; try{ d=await r.json(); }catch(e){} return {status:r.status,ok:r.ok,d}; }
/* lecture : on envoie la révision connue ; le serveur répond « same » si rien n'a changé (1 seule lecture côté stockage) */
function apiGet(){ const r=S.rev||LS.get("getuma-rev",""); const hasData=Object.keys(S.groups).length||Object.keys(S.clubs).length; return api("GET",undefined,hasData&&r?`?rev=${encodeURIComponent(r)}`:""); }
async function api(method,body,qs=""){ const r=await call("/api/db"+qs,method,body); if(r.status===401){ toLogin(); throw new Error("auth"); } if(!r.ok) throw new Error("http "+r.status); return r.d; }
function toLogin(){ S.mode="login"; S.authView="login"; render(); }
function wipeLocal(){ OUTBOX=[]; ["getuma-outbox","getuma-cache","getuma-me","getuma-lastsync","getuma-rev"].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} }); Object.assign(S,{content:{},ed:null,clubs:{},groups:{},gymnasts:{},sessions:{},attendance:{},members:{},me:null,groupId:null,rev:""}); }
async function flush(){ if(flushing||!OUTBOX.length||!S.me||!navigator.onLine) return; flushing=true; try{ const batch=OUTBOX.slice(0,40); const res=await api("POST",{ops:batch}); const done=new Set(res.done); OUTBOX=OUTBOX.filter(o=>!done.has(o.qid)); LS.set("getuma-outbox",OUTBOX); S.syncErr=false; if(res.rejected&&res.rejected.length) toast("Une modification a été refusée (droits insuffisants)"); }catch(e){ if(e.message!=="auth") S.syncErr=true; } finally{ flushing=false; render(); if(OUTBOX.length&&!S.syncErr&&S.me) flush(); } }
async function pull(){ if(!S.me||!navigator.onLine) return; try{ await flush(); const d=await apiGet(); if(OUTBOX.length) return; if(d.same){ S.me=d.me||S.me; S.lastSync=new Date().toISOString(); S.syncErr=false; if(S.mode==="loading") S.mode="shared"; return; } S.rev=d.rev||""; LS.set("getuma-rev",S.rev); Object.assign(S,{me:d.me,content:d.content||{},clubs:d.clubs||{},groups:d.groups||{},gymnasts:d.gymnasts||{},sessions:d.sessions||{},attendance:d.attendance||{},members:d.members||{}}); S.lastSync=new Date().toISOString(); LS.set("getuma-lastsync",S.lastSync); S.syncErr=false; saveCache(); if(S.mode!=="login") S.mode="shared"; render(); }catch(e){ if(e.message!=="auth"){ S.syncErr=true; if(S.mode==="loading") S.mode="shared"; render(); } } }
/* ---------- logique ---------- */
const gGroups=g=>Array.isArray(g&&g.groupIds)?g.groupIds:(g&&g.groupId?[g.groupId]:[]);
const gyms=()=>Object.entries(S.gymnasts).filter(([,g])=>gGroups(g).includes(S.groupId)).map(([id,g])=>({id,...g})).sort((a,b)=>(a.name||"").localeCompare(b.name||"","fr"));
const stOf=(g,eid)=>(g&&g.st&&g.st[eid]&&g.st[eid].s)||0;
const inLevel=e=>S.level==="all"?true:(e.base||minCat(e)<=1);
const elements=()=>ALLE.filter(e=>e.a===S.engin).filter(inLevel).sort((a,b)=>famRank(famOf(a))-famRank(famOf(b))||codeOf(a)-codeOf(b)||minCat(a)-minCat(b)||a.n.localeCompare(b.n,"fr"));
const forGym=(e,g)=>e.base||e.c.includes(g.cat)||minCat(e)<catIdx(g.cat);
const maxCat=e=>{ if(e.base) return -1; const ix=e.c.map(catIdx).filter(i=>i>=0); return ix.length?Math.max(...ix):-1; };
/* élément plus demandé dans la catégorie du gymnaste (catégories inférieures seulement) et jamais évalué : considéré acquis */
const implicitOk=()=>false; /* abandonné le 24.11.2026 : chaque élément doit être évalué */
const effSt=(g,eid)=>implicitOk(g,BY[eid])?3:stOf(g,eid);
const ownCat=(e,g)=>e.base||e.c.includes(g.cat);
function preOk(g,pid){ const s=stOf(g,pid); if(s>=3) return true; const p=BY[pid]; if(!p) return true; return s===0&&!p.base&&minCat(p)<catIdx(g.cat); }
function needs(g){ const out=[]; for(const e of elements()){ if(!forGym(e,g)) continue; const s=effSt(g,e.id); if(s>=3) continue; const miss=preOf(e.id).filter(p=>!preOk(g,p)); out.push({e,s,ready:!miss.length,miss}); } out.sort((a,b)=>(b.ready-a.ready)||((b.s>0)-(a.s>0))||(b.s-a.s)||(minCat(a.e)-minCat(b.e))); return out; }
function progress(g){ const els=elements().filter(e=>forGym(e,g)); const done=els.filter(e=>effSt(g,e.id)>=3).length; return {done,total:els.length,pct:els.length?Math.round(done/els.length*100):0}; }
function workGroups(list,max){ const b={},free=[]; for(const g of list){ const n=needs(g).filter(x=>x.ready); if(!n.length){ free.push(g); continue; } (b[n[0].e.id]=b[n[0].e.id]||[]).push(g); } const out=[]; for(const [eid,l] of Object.entries(b)) for(let i=0;i<l.length;i+=max) out.push({eid,gyms:l.slice(i,i+max)}); out.sort((a,b)=>b.gyms.length-a.gyms.length||minCat(BY[a.eid])-minCat(BY[b.eid])); if(free.length) out.push({eid:null,gyms:free}); return out; }

function vTree(){
  const all=ALLE.filter(e=>e.a===S.engin); const fams=famList(all); if(S.treeFam&&!fams.includes(S.treeFam)) S.treeFam="";
  let set=all.filter(e=>!S.treeFam||famOf(e)===S.treeFam);
  if(S.treeFam){ const ids=new Set(set.map(e=>e.id)); const extra=all.filter(e=>!ids.has(e.id)&&(preOf(e.id).some(p=>ids.has(p))||set.some(s=>preOf(s.id).includes(e.id)))); set=set.concat(extra.map(e=>({...e,ghost:1}))); }
  const ids=new Set(set.map(e=>e.id)); const lv={}; const level=(id,stack=new Set())=>{ if(lv[id]!=null) return lv[id]; if(stack.has(id)) return 0; stack.add(id); const ps=preOf(id).filter(p=>ids.has(p)); lv[id]=ps.length?1+Math.max(...ps.map(p=>level(p,stack))):0; return lv[id]; };

  const sel=S.treeSel&&ids.has(S.treeSel)?BY[S.treeSel]:null; const sp=sel?new Set(preOf(sel.id)):new Set(), sn=sel?new Set(nextOf(sel.id).map(e=>e.id)):new Set();
  const cls=e=>[e.ghost?"ghost":"",sel?(e.id===sel.id?"sel":sp.has(e.id)?"pre":sn.has(e.id)?"nxt":"dim"):""].join(" ");
  const node=e=>`<button class="tnode ${cls(e)}" data-tn="${e.id}"><span class="code">${/^\d{5}$/.test(e.stv||"")?e.stv:e.base?"Base":""}</span><span class="tn">${esc(e.n.length>48?e.n.slice(0,46)+"…":e.n)}</span><span class="xs muted">${catRange(e)}</span></button>`;
  return `<button class="back" data-go="biblio">‹ Bibliothèque</button><h1 style="font-size:22px">Arbre de progression · ${enginName(S.engin)}</h1>${enginBar()}
  <div class="pillbar"><button class="pill" data-tf="" aria-pressed="${!S.treeFam}">Tout</button>${fams.map(f=>`<button class="pill" data-tf="${esc(f)}" aria-pressed="${S.treeFam===f}">${esc(f)}</button>`).join("")}</div>
  ${isAdmin()?`<div class="row"><button class="btn ${S.treeEdit?"primary":""}" data-tedit>${S.treeEdit?"Terminer la modification":"Modifier les liens"}</button>${S.treeEdit?`<div class="seg" style="width:auto;grid-template-columns:1fr 1fr"><button data-tdir="pre" aria-pressed="${S.treeDir!=="next"}" class="s-p">Prérequis</button><button data-tdir="next" aria-pressed="${S.treeDir==="next"}" class="s-p">Suivant</button></div>`:""}</div>`:""}
  <p class="small muted" style="margin:0">${S.treeEdit?(sel?`Touche un autre élément pour l'ajouter comme <b>${S.treeDir==="next"?"élément suivant":"prérequis"}</b> de « ${esc(sel.n)} », ou pour retirer un lien existant.`:"Touche d'abord l'élément à modifier."):"Du haut vers le bas : chaque élément s'appuie sur ceux du dessus. Touche un élément pour voir ses liens."}</p>
  ${sel?`<div class="selbar"><b>${esc(sel.n)}</b><span class="small"><span class="dot pre"></span>${sp.size} prérequis · <span class="dot nxt"></span>${sn.size} suivant${sn.size>1?"s":""}</span><button class="btn" data-go="biblio--el-${sel.id}">Fiche</button></div>`:""}
  <div class="tree">${Object.keys(rows).sort((a,b)=>a-b).map(k=>`<div class="tlevel"><div class="lvl">Étape ${+k+1}</div><div class="tnodes">${rows[k].sort((a,b)=>famRank(famOf(a))-famRank(famOf(b))||codeOf(a)-codeOf(b)).map(node).join("")}</div></div>`).join("")}<svg class="tlinks" aria-hidden="true"></svg></div>`;
}
function drawTree(){ const box=document.querySelector(".tree"), svg=box&&box.querySelector(".tlinks"); if(!svg) return; const r0=box.getBoundingClientRect(); svg.setAttribute("width",r0.width); svg.setAttribute("height",r0.height);
  const pos={}; box.querySelectorAll("[data-tn]").forEach(b=>{ const r=b.getBoundingClientRect(); pos[b.dataset.tn]={x:r.left-r0.left+r.width/2,top:r.top-r0.top,bot:r.bottom-r0.top}; });
  let out=""; for(const id of Object.keys(pos)) for(const p of preOf(id)){ if(!pos[p]) continue; const a=pos[p], b=pos[id]; const hl=S.treeSel&&(S.treeSel===id||S.treeSel===p); const y1=a.bot, y2=b.top, my=(y1+y2)/2;
    out+=`<path d="M${a.x},${y1} C${a.x},${my} ${b.x},${my} ${b.x},${y2}" class="${hl?"hl":""}"/>`; }

function treeTap(id){
  if(!S.treeEdit||!S.treeSel||S.treeSel===id){ S.treeSel=S.treeSel===id?null:id; render(); return; }
  const sel=S.treeSel; const [child,parent]=S.treeDir==="next"?[id,sel]:[sel,id];
  const linked=preOf(child).includes(parent), rev=preOf(parent).includes(child);
  const save=(c,arr)=>store.set("content","el_"+c,{...(CT("el_"+c)||{}),pre:arr});
  if(linked){ save(child,preOf(child).filter(p=>p!==parent)); toast("Lien retiré"); }
  else if(rev){ save(parent,preOf(parent).filter(p=>p!==child)); toast("Lien retiré"); }
  else if(ancestors(parent).has(child)){ toast("Impossible : ça créerait une boucle"); return; }
  else { save(child,[...preOf(child),parent]); toast(`« ${BY[parent].n} » est maintenant prérequis de « ${BY[child].n} »`); }
}

async function uploadMedia(file){
  if(!navigator.onLine){ toast("Pas de réseau : envoi impossible"); return; }
  let f=file;
  if(/^image\/(jpeg|png|webp)$/.test(f.type)) f=await shrink(f).catch(()=>file);
  if(f.size>100*1024*1024){ toast("Fichier trop lourd (100 Mo max). Mets la vidéo sur YouTube et colle le lien."); return; }
  const EXT={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov"};
  if(!EXT[f.type]){ toast("Format non pris en charge"); return; }
  S.upl=true; render();
  if(f.size>4*1024*1024){ /* gros fichier : envoi direct vers le stockage privé, en plusieurs morceaux */
    try{ const {upload}=await import("/vendor/blob-client.js"); const key=`${crypto.randomUUID()}.${EXT[f.type]}`;
      await upload(`media/${key}`,f,{access:"private",handleUploadUrl:"/api/media/upload",contentType:f.type,multipart:f.size>20*1024*1024});
      if(S.ed) S.ed.d.media.push({url:`/api/media?k=${key}`,type:f.type.startsWith("video")?"video":"img",cap:($("#edCap")||{}).value||""}); toast("Fichier ajouté");
    }catch(e){ console.error(e); toast("Envoi impossible. Réessaie ou passe par un lien YouTube."); }
    finally{ S.upl=false; render(); }
    return;
  }
  try{ const fd=new FormData(); fd.append("file",f,f.name||"media"); const r=await fetch("/api/media",{method:"POST",body:fd,headers:{"x-getuma":"1"},credentials:"same-origin"}); const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.url){ toast(r.status===415?"Format non pris en charge":r.status===413?"Fichier trop lourd (4 Mo max)":"Envoi impossible"); return; }
    if(S.ed){ S.ed.d.media.push({url:j.url,type:j.type,cap:($("#edCap")||{}).value||""}); } toast("Fichier ajouté");
  } finally{ S.upl=false; render(); }
}
function shrink(file){ return new Promise((ok,ko)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)); if(k===1&&file.size<1.5e6){ URL.revokeObjectURL(u); ok(file); return; } const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>{ URL.revokeObjectURL(u); b?ok(new File([b],"photo.jpg",{type:"image/jpeg"})):ko(); },"image/jpeg",0.85); }; img.onerror=()=>{ URL.revokeObjectURL(u); ko(); }; img.src=u; }); }

function chart(g){
  const log=Object.entries(g.log||{}).map(([k,v])=>({k,...v})).filter(l=>BY[l.e]&&BY[l.e].a==="sol").sort((a,b)=>(a.d+a.k).localeCompare(b.d+b.k));

  if(pts.length<2) return "";

}

     <div class="divide">${gs.map(([gid,g])=>`<div class="li" style="min-height:40px"><span class="grow small">${esc(g.name)} <span class="muted">· ${Object.values(S.gymnasts).filter(x=>gGroups(x).includes(gid)).length} gymnastes</span></span><button class="btn link" data-renamegroup="${gid}">Renommer</button><button class="btn link danger" data-delgroup="${gid}">Supprimer</button></div>`).join("")||`<span class="small muted">Aucun groupe.</span>`}</div>

   <form id="newClubForm" class="row" style="flex-wrap:nowrap"><input class="inp" id="newClubIn" placeholder="Nouvelle société de gym" aria-label="Nom de la nouvelle société"><button class="btn primary">Créer</button></form></div>

     ${u.role!=="admin"?`<div class="pillbar">${clubs.map(([cid,c])=>`<label class="pill" for="uc-${u.uid}-${cid}"><input type="checkbox" id="uc-${u.uid}-${cid}" data-userclub="${u.uid}|${cid}" ${(u.clubs||[]).includes(cid)?"checked":""}> ${esc(c.name)}</label>`).join("")||`<span class="small muted">Crée d'abord une société.</span>`}</div>`:`<span class="xs muted">Accès à toutes les sociétés.</span>`}
     ${u.uid===S.me.uid?`<span class="xs muted">C'est ton compte.</span>`:`<div class="row">${u.status!=="active"?`<button class="btn primary" data-uact="${u.uid}|activate">Valider</button>`:`<button class="btn" data-uact="${u.uid}|disable">Désactiver</button>`}<button class="btn" data-uact="${u.uid}|${u.role==="admin"?"coach":"admin"}">${u.role==="admin"?"Retirer admin":"Rendre admin"}</button><button class="btn" data-uact="${u.uid}|reset">Nouveau mot de passe</button><button class="btn link danger" data-uact="${u.uid}|delete">Supprimer</button></div>`}</div>`).join("")}</div>`;

async function loadAdmin(){ const r=await call("/api/admin","GET"); if(r.ok){ S.admin={users:r.d.users}; render(); } else toast("Impossible de charger les comptes"); }
async function adminAction(body,msg){ const r=await call("/api/admin","POST",body); if(!r.ok){ toast(r.d.error==="self"?"Action impossible sur ton propre compte":"Action refusée"); return null; } if(msg) toast(msg); await loadAdmin(); pull(); return r.d; }
function infoBox(html){ const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<section role="dialog" aria-modal="true">${html}<div class="row" style="justify-content:flex-end"><button class="btn primary" data-no>Fermer</button></div></section>`; m.addEventListener("click",e=>{ if(e.target===m||e.target.closest("[data-no]")) m.remove(); }); document.body.appendChild(m); }
function vAuth(){
  const v=S.authView; const err=S.authErr?`<p class="small" style="color:#d44c47;margin:0">${esc(S.authErr)}</p>`:"";

function render(){
  const entries=Object.entries(S.groups);
  if(!S.groups[S.groupId]) S.groupId=(entries.find(([id])=>Object.values(S.gymnasts).some(g=>gGroups(g).includes(id)))||entries[0]||[null])[0];
  const {r,id}=parse();
  document.querySelectorAll("#tabs a").forEach(a=>a.setAttribute("aria-current",a.getAttribute("href")==="#"+r?"page":"false"));
  if(S.mode==="login"){ document.getElementById("tabs").hidden=true; const fa=document.activeElement&&document.activeElement.id; if(fa&&/^(li|su)/.test(fa)) return; V.innerHTML=vAuth(); return; }
  document.getElementById("tabs").hidden=false;
  if(S.mode==="loading"){ V.innerHTML=`<div class="empty">Chargement…</div>`; return; }
  if(!entries.length&&!(r==="gymnastes"&&(id==="admin"||id==="reglages"))){ V.innerHTML=`${banner()}<h1>GETUMA Coach</h1><div class="empty">${isAdmin()?`Commence par créer une société et un groupe.<br><br><button class="btn primary" data-go="gymnastes--admin">Ouvrir l'administration</button>`:`Ton compte n'est rattaché à aucun groupe pour l'instant. Demande à l'administrateur de t'ajouter à ta société.<br><br><button class="btn" data-go="gymnastes--reglages">Mon compte</button>`}</div>`; return; }
  const ae=document.activeElement, aid=ae&&ae.id, sy=window.scrollY;
  const typing=ae&&(ae.tagName==="INPUT"||ae.tagName==="TEXTAREA")&&ae.type!=="checkbox"; if(typing&&(ae.dataset.keep!==undefined||aid==="bibQ"||ae.closest(".tbl")||ae.id==="pasteIn"||aid==="gNote"||aid==="bulkIn"||aid==="gBdns"||aid==="pfBdns"||aid==="presLieu"||aid==="gName"||aid==="newClubIn"||aid==="pwCur"||aid==="pwNew"||ae.closest("form[data-newgroup]")||ae.dataset.clubname)) return; /* ne pas écraser une saisie en cours */
  V.classList.toggle("wide",r==="gymnastes"&&id==="tableau");
  const keepSc=[...V.querySelectorAll(".tscroll,.pillbar")].map(el=>[el.scrollTop,el.scrollLeft]);
  V.innerHTML=({evaluer:vEvaluer,groupes:vGroupes,seance:vSeance,presences:vPresences,biblio:vBiblio,gymnastes:vGymnastes})[r](id);
  V.querySelectorAll(".tscroll,.pillbar").forEach((el,i)=>{ if(keepSc[i]){ el.scrollTop=keepSc[i][0]; el.scrollLeft=keepSc[i][1]; } });
  if(V.querySelector(".tree")) requestAnimationFrame(drawTree);
  window.scrollTo(0,sy);
}

/* ---------- interactions ---------- */
document.addEventListener("toggle",e=>{ const d=e.target; if(d.dataset&&d.dataset.acc!==undefined){ S.acc=S.acc||{}; S.acc[d.dataset.acc]=d.open; } },true);
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.set){ const [gid,eid,s]=t.dataset.set.split("|"); const cur=stOf(S.gymnasts[gid],eid); if(+s!==cur) setStatus(gid,eid,+s); return; }
  if(t.id==="syncNow"){ pull().then(()=>toast(S.syncErr?"Pas de réseau":"Synchronisé")); return; }
  if(t.id==="logout"){ confirmBox(OUTBOX.length?"Des modifications ne sont pas encore envoyées. Se déconnecter quand même ?":"Se déconnecter de ce téléphone ?","Se déconnecter",()=>{ call("/api/auth/logout","POST").catch(()=>{}); wipeLocal(); S.admin=null; toLogin(); }); return; }
  if(t.dataset.auth){ S.authView=t.dataset.auth; S.authErr=""; render(); return; }
  if(t.dataset.delclub){ const cid=t.dataset.delclub; const n=Object.values(S.groups).filter(g=>g.clubId===cid).length; if(n){ toast("Supprime d'abord les groupes de cette société"); return; } confirmBox(`Supprimer la société ${S.clubs[cid]?.name||""} ?`,"Supprimer",()=>store.del("clubs",cid)); return; }
  if(t.dataset.delgroup){ const gid=t.dataset.delgroup; const n=Object.values(S.gymnasts).filter(g=>gGroups(g).includes(gid)).length; confirmBox(n?`Supprimer ce groupe ? Ses ${n} gymnastes ne seront plus visibles.`:"Supprimer ce groupe ?","Supprimer",()=>{ store.del("groups",gid); if(S.groupId===gid) S.groupId=null; }); return; }
  if(t.dataset.renamegroup){ const gid=t.dataset.renamegroup; const m=document.createElement("div"); m.className="modal"; m.innerHTML=`<section role="dialog" aria-modal="true"><label class="f" for="rnIn">Nom du groupe<input class="inp" id="rnIn" value="${esc(S.groups[gid]?.name||"")}"></label><div class="row" style="justify-content:flex-end"><button class="btn" data-no>Annuler</button><button class="btn primary" data-yes>Renommer</button></div></section>`; m.addEventListener("click",e=>{ if(e.target===m||e.target.closest("[data-no]")) m.remove(); if(e.target.closest("[data-yes]")){ const v=$("#rnIn",m).value.trim().slice(0,60); m.remove(); if(v) store.patch("groups",gid,{name:v}); } }); document.body.appendChild(m); return; }
  if(t.dataset.uact){ const [u,act]=t.dataset.uact.split("|"); const usr=(S.admin&&S.admin.users||[]).find(x=>x.uid===u)||{};
    if(act==="activate") adminAction({action:"update",uid:u,status:"active"},"Compte validé");
    else if(act==="disable") adminAction({action:"update",uid:u,status:"disabled"},"Compte désactivé");
    else if(act==="admin"||act==="coach") confirmBox(act==="admin"?`Donner les droits d'administrateur à ${usr.name} ? Il pourra tout voir et tout modifier.`:`Retirer les droits d'administrateur à ${usr.name} ?`,"Confirmer",()=>adminAction({action:"update",uid:u,role:act},"Rôle modifié"));
    else if(act==="reset") confirmBox(`Générer un nouveau mot de passe pour ${usr.name} ? L'ancien ne marchera plus.`,"Générer",async()=>{ const d=await adminAction({action:"resetPassword",uid:u}); if(d&&d.password) infoBox(`<b>Nouveau mot de passe de ${esc(usr.name)}</b><p style="font:600 20px ui-monospace,monospace;margin:0;user-select:all">${esc(d.password)}</p><p class="small muted" style="margin:0">Transmets-le-lui directement. Il pourra le changer dans Réglages › Mon compte. Ce mot de passe ne sera plus affiché.</p>`); });
    else if(act==="delete") confirmBox(`Supprimer le compte de ${usr.name} ?`,"Supprimer",()=>adminAction({action:"delete",uid:u},"Compte supprimé"));
    return; }
  if(t.dataset.go){ go(...t.dataset.go.split("--")); return; }
  if(t.dataset.gs!==undefined){ const k=t.dataset.gs; S.gsort.d=S.gsort.k===k?-S.gsort.d:1; S.gsort.k=k; saveSort(); render(); return; }
  if(t.dataset.gy!==undefined){ S.gsort.yr=t.dataset.gy; saveSort(); render(); return; }
  if(t.dataset.gc!==undefined){ S.gsort.cat=t.dataset.gc; saveSort(); render(); return; }
  if(t.dataset.bf){ const [k,v]=t.dataset.bf.split("|"); S.bib=S.bib||{}; S.bib[k]=S.bib[k]===v?"":v; render(); return; }
  if(t.dataset.fam){ S.fam=t.dataset.fam; render(); return; }
  if(t.dataset.max){ S.maxSize=+t.dataset.max; saveUi(); render(); return; }
  if(t.dataset.level){ S.level=t.dataset.level; saveUi(); render(); return; }
  if(t.hasAttribute("data-toggleall")){ S.showAll=!S.showAll; render(); return; }
  if(t.dataset.unlink){ const gid=t.dataset.unlink; const g=S.gymnasts[gid]; const next=gGroups(g).filter(x=>x!==S.groupId); if(!next.length){ confirmBox(`Retirer ${g.name} de ${S.groups[S.groupId]?.name||"ce groupe"} ? S'il n'est inscrit dans aucun autre groupe, son suivi sera supprimé.`,"Retirer",()=>{ store.del("gymnasts",gid); go("gymnastes"); }); } else { store.patch("gymnasts",gid,{groupIds:next}); go("gymnastes"); } return; }
  if(t.id==="addRow"){ const gid=uid(); store.set("gymnasts",gid,{name:"Nouveau",prenom:"",nom:"",cat:"C1",groupIds:[S.groupId],groupId:S.groupId,st:{},log:{},created:today()}); setTimeout(()=>{ const el=document.querySelector(`[data-cell="${gid}|prenom"]`); if(el){ el.focus(); el.scrollIntoView({block:"center"}); } },50); return; }
  if(t.id==="presAll"){ const key=presKey(); ensurePres(key); const a=S.attendance[key]; const pres={},st={}; gyms().forEach(g=>{ if(!pst(a,g.id).s){ pres[g.id]=1; st[g.id]={s:"p"}; } }); store.patch("attendance",key,{present:pres,st}); return; }
  if(t.id==="edSave"){ edSave(); return; }
  if(t.id==="edReset"){ const ed=S.ed; confirmBox("Annuler toutes tes modifications de cette fiche ? Elle reviendra au contenu de base de GETUMA (catalogue, ateliers et fiches intégrés, ta bibliothèque d'exercices).","Annuler mes modifications",()=>{ store.del("content",ed.key); S.ed=null; go("biblio",`${ed.kind}-${ed.id}`); }); return; }
  if(t.id==="edAddUrl"){ const u=($("#edUrl").value||"").trim(); if(!okUrl(u)){ toast("Lien invalide (il doit commencer par https://)"); return; } S.ed.d.media.push({url:u,cap:($("#edCap").value||"").trim()}); render(); return; }
  if(t.dataset.edm){ const [a,i]=t.dataset.edm.split("|"); const m=S.ed.d.media; if(a==="del") m.splice(+i,1); else if(+i>0) [m[+i-1],m[+i]]=[m[+i],m[+i-1]]; render(); return; }
  if(t.dataset.edp){ const [a,i]=t.dataset.edp.split("|"); const m=S.ed.d.postes; if(a==="del") m.splice(+i,1); else if(+i>0) [m[+i-1],m[+i]]=[m[+i],m[+i-1]]; render(); return; }
  if(t.dataset.edrm){ const [f,id]=t.dataset.edrm.split("|"); S.ed.d[f]=S.ed.d[f].filter(x=>x!==id); render(); return; }
  if(t.id==="edNewPoBtn"){ const n=($("#edNewPo").value||"").trim(); if(!n) return; const pid="n"+uid(); store.set("content","po_"+pid,{n,fam:famOf(BY[S.ed.id])==="Autres"?"":famOf(BY[S.ed.id])}); S.ed.d.postes.push(pid); $("#edNewPo").value=""; render(); return; }
  if(t.dataset.presgo){ S.presDate=t.dataset.presgo; go("presences"); return; }
  if(t.id==="presNone"){ const key=presKey(); const a=S.attendance[key]; if(!a) return; const pres={},st={}; gyms().forEach(g=>{ if(pst(a,g.id).s==="p"){ pres[g.id]=0; st[g.id]={s:"",late:0,early:0}; } }); store.patch("attendance",key,{present:pres,st}); return; }
  if(t.dataset.ps){ const [key,gid,s]=t.dataset.ps.split("|"); const cur=pst(S.attendance[key],gid); setPres(key,gid,cur.s===s?{s:"",late:0,early:0}:{s}); return; }
  if(t.dataset.pf){ const [key,gid,f]=t.dataset.pf.split("|"); const cur=pst(S.attendance[key],gid); setPres(key,gid,{[f]:cur[f]?0:(f==="late"?10:15)}); return; }
  if(t.dataset.engin){ S.engin=t.dataset.engin; S.fam="Tous"; try{ localStorage.setItem("getuma-engin",S.engin); }catch(x){} render(); return; }
  if(t.dataset.tn){ treeTap(t.dataset.tn); return; }
  if(t.dataset.tf!==undefined){ S.treeFam=t.dataset.tf; S.treeSel=null; render(); return; }
  if(t.dataset.tedit!==undefined){ S.treeEdit=!S.treeEdit; render(); return; }
  if(t.dataset.tdir){ S.treeDir=t.dataset.tdir; render(); return; }
  if(t.dataset.scroll){ const el=document.getElementById(t.dataset.scroll); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  if(t.dataset.unprog){ const [gid,id]=t.dataset.unprog.split("|"); store.patch("gymnasts",gid,{prog:{[id]:null}}); return; }

  if(t.dataset.rankmode!==undefined){ S.rankMode=!S.rankMode; render(); return; }
  if(t.dataset.rk){ const [eid,gid,dir,s]=t.dataset.rk.split("|"); const r=rankIn(eid,gyms(),+s); const i=r.findIndex(g=>g.id===gid), j=i+ +dir; if(i<0||j<0||j>=r.length) return; [r[i],r[j]]=[r[j],r[i]]; r.forEach((g,n)=>{ if(((S.gymnasts[g.id].rk||{})[eid])!==n) store.patch("gymnasts",g.id,{rk:{[eid]:n}}); }); return; }
  if(t.id==="presExport"){ exportBdns(); return; }
  if(t.id==="presCopy"){ navigator.clipboard.writeText(S.lastCsv||"").then(()=>toast("CSV copié"),()=>toast("Copie refusée")); return; }
  if(t.dataset.delgym){ const g=S.gymnasts[t.dataset.delgym]; confirmBox(`Supprimer définitivement ${g.name} de tous ses groupes, avec son historique ?`,"Supprimer",()=>{ store.del("gymnasts",t.dataset.delgym); go("gymnastes"); }); return; }
  if(t.id==="savePlan"&&S.plan){ const pid=uid(); const p={...S.plan,id:pid}; S.plan=null; store.set("sessions",pid,p);
    const key=`${p.groupId}_${p.date}`; ensurePres(key,p.date); store.patch("attendance",key,{start:p.start,dur:p.dur,session:pid,coaches:Object.fromEntries((p.coaches||[]).map(c=>[c,1]))}); toast("Séance enregistrée"); go("seance",pid); return; }
  if(t.id==="copyPlan"){ const {id}=parse(); const p=id==="nouvelle"?S.plan:S.sessions[id]; if(p) navigator.clipboard.writeText(planText(p)).then(()=>toast("Texte copié"),()=>toast("Copie refusée")); return; }
  if(t.dataset.delplan){ confirmBox("Supprimer cette séance ?","Supprimer",()=>{ store.del("sessions",t.dataset.delplan); go("seance"); }); return; }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="groupSel"){ S.groupId=t.value; saveUi(); render(); }
  else if(t.dataset.cat){ store.patch("gymnasts",t.dataset.cat,{cat:t.value}); }
  else if(t.dataset.cell){ const [gid,f]=t.dataset.cell.split("|"); let v=t.value.trim(); if(f==="annee"){ v=v.replace(/\D/g,"").slice(0,4); if(v&&(+v<1950||+v>new Date().getFullYear())){ toast("Année invalide"); t.value=yearOf(S.gymnasts[gid]||{}); return; } } if(f==="bdns"||f==="fsg") v=v.replace(/[^\d]/g,"").slice(0,12); else v=v.slice(0,f==="adresse"?120:60); const g=S.gymnasts[gid]; if(!g||(g[f]||"")===v) return; const patch={[f]:v}; if(f==="prenom"||f==="nom"){ const [p0,n0]=splitName(g); const pr=f==="prenom"?v:p0, nm=f==="nom"?v:n0; patch.prenom=pr; patch.nom=nm; const full=`${pr} ${nm}`.trim(); if(full) patch.name=full; } store.patch("gymnasts",gid,patch); }
  else if(t.dataset.gymgroup){ const [gid,grp]=t.dataset.gymgroup.split("|"); const cur=gGroups(S.gymnasts[gid]); const next=t.checked?[...new Set([...cur,grp])]:cur.filter(x=>x!==grp); if(!next.length){ t.checked=true; toast("Un gymnaste doit rester dans au moins un groupe"); return; } store.patch("gymnasts",gid,{groupIds:next}); }
  else if(t.dataset.bdns){ const v=t.value.replace(/\D/g,"").slice(0,12); t.blur(); store.patch("gymnasts",t.dataset.bdns,{bdns:v}); }
  else if(t.dataset.edadd!==undefined){ if(t.value){ S.ed.d[t.dataset.edadd].push(t.value); render(); } }
  else if(t.dataset.edpadd!==undefined){ if(t.value){ S.ed.d.postes.push(t.value); render(); } }
  else if(t.id==="edFile"){ if(t.files&&t.files[0]) uploadMedia(t.files[0]); }
  else if(t.dataset.extra!==undefined){ S.extra=t.checked; try{ localStorage.setItem("getuma-extra",S.extra?"1":"0"); }catch(x){} render(); }
  else if(t.dataset.pm){ const [key,gid,f]=t.dataset.pm.split("|"); let v=t.value.trim(); if(f!=="m") v=Math.max(0,Math.min(300,parseInt(v,10)||0)); else v=v.slice(0,80); setPres(key,gid,{[f]:v}); }
  else if(t.dataset.pres){ const [key,gid]=t.dataset.pres.split("|"); togglePresence(key,gid,t.checked); }
  else if(t.dataset.prescoach){ const [key,name]=t.dataset.prescoach.split("|"); togglePresence(key,null,t.checked,name); }
  else if(t.id==="presDate"){ S.presDate=t.value; render(); }
  else if(["presStart","presDur","presLieu"].includes(t.id)){ const key=presKey(); ensurePres(key); const f={presStart:"start",presDur:"dur",presLieu:"lieu"}[t.id]; const v=t.id==="presDur"?(+t.value||0):t.value.slice(0,60); t.blur(); store.patch("attendance",key,{[f]:v}); if(isAdmin()) store.patch("groups",S.groupId,{["def_"+f]:v}); }
  else if(t.dataset.note){ const v=t.value.slice(0,500); t.blur(); store.patch("gymnasts",t.dataset.note,{note:v}); }
  else if(t.dataset.clubname){ const v=t.value.trim().slice(0,60); t.blur(); if(v) store.patch("clubs",t.dataset.clubname,{name:v}); }
  else if(t.dataset.userclub){ const [u]=t.dataset.userclub.split("|"); const cl=[...document.querySelectorAll(`[data-userclub^="${u}|"]`)].filter(x=>x.checked).map(x=>x.dataset.userclub.split("|")[1]); adminAction({action:"update",uid:u,clubs:cl},"Sociétés mises à jour"); }
  else if(t.id==="gName"){ const v=t.value.trim().slice(0,60)||"Groupe"; t.blur(); store.patch("groups",S.groupId,{name:v}); }
});
document.addEventListener("submit",e=>{
  if(e.target.id==="newPoste"){ e.preventDefault(); const n=($("#newPosteN").value||"").trim(); if(!n) return; const pid="n"+uid(); store.set("content","po_"+pid,{n,fam:$("#newPosteF").value}); go("biblio","edit-po-"+pid); return; }
  e.preventDefault(); const f=e.target;
  if(f.id==="bulkForm"){ const names=$("#bulkIn").value.split(/\n|,/).map(s=>s.trim()).filter(Boolean).slice(0,60); const cat=$("#bulkCat").value; $("#bulkIn").blur(); (async()=>{ for(const n of names) await store.set("gymnasts",uid(),{name:n.slice(0,40),cat,groupIds:[S.groupId],groupId:S.groupId,st:{},log:{},created:today()}); })(); toast(`${names.length} ajouté${names.length>1?"s":""}`); go("gymnastes"); }
  if(f.id==="loginForm"){ const email=$("#liEmail").value.trim(), password=$("#liPw").value; document.activeElement.blur(); S.authErr=""; call("/api/auth/login","POST",{email,password}).then(r=>{ if(r.ok){ wipeLocal(); S.me=r.d.user; S.mode="loading"; saveCache(); render(); pull(); } else { S.authErr=r.d.error==="pending"?"":r.d.error==="locked"?"Trop d'essais. Réessaie dans 15 minutes.":r.d.error==="disabled"?"Ce compte est désactivé.":"E-mail ou mot de passe incorrect."; if(r.d.error==="pending") S.authView="pending"; render(); } }).catch(()=>{ S.authErr="Pas de réseau."; render(); }); return; }
  if(f.id==="signupForm"){ const name=$("#suName").value.trim(), email=$("#suEmail").value.trim(), password=$("#suPw").value; document.activeElement.blur(); S.authErr=""; call("/api/auth/signup","POST",{name,email,password}).then(r=>{ if(r.ok){ if(r.d.user.status==="active"){ wipeLocal(); S.me=r.d.user; S.mode="loading"; saveCache(); render(); pull(); } else { S.authView="pending"; render(); } } else { S.authErr=r.d.error==="exists"?"Un compte existe déjà avec cet e-mail.":r.d.error==="password"?"Le mot de passe doit faire au moins 10 caractères.":r.d.error==="email"?"E-mail invalide.":"Création impossible pour le moment."; render(); } }).catch(()=>{ S.authErr="Pas de réseau."; render(); }); return; }
  if(f.id==="pasteForm"){ const rows=$("#pasteIn").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); $("#pasteIn").blur(); let n=0; (async()=>{ for(const l of rows.slice(0,100)){ const c=l.split(/\t|;/).map(x=>x.trim()); if(!c[0]&&!c[1]) continue; if(/pr[ée]nom/i.test(c[0])) continue; const [prenom="",nom="",naiss="",cat="",fsg="",bdns0="",adresse0="",tel10="",tel20=""]=c; const [bdns,adresse,tel1,tel2]=S.extra?[bdns0,adresse0,tel10,tel20]:["","","",""]; const yr=/^\d{4}$/.test(naiss)?naiss:(toIsoDate(naiss)||"").slice(0,4); const catOk=/^C[1-7]$/i.test(cat)?cat.toUpperCase():"C1"; await store.set("gymnasts",uid(),{name:`${prenom} ${nom}`.trim().slice(0,60)||"Sans nom",prenom:prenom.slice(0,60),nom:nom.slice(0,60),naissance:S.extra?toIsoDate(naiss):"",annee:yr,cat:catOk,fsg:fsg.replace(/\D/g,"").slice(0,12),bdns:bdns.replace(/\D/g,"").slice(0,12),adresse:adresse.slice(0,120),tel1:tel1.slice(0,30),tel2:tel2.slice(0,30),groupIds:[S.groupId],groupId:S.groupId,st:{},log:{},created:today()}); n++; } toast(`${n} gymnaste(s) importé(s)`); })(); return; }
  if(f.id==="linkForm"){ const gid=$("#linkSel").value; const cur=gGroups(S.gymnasts[gid]); store.patch("gymnasts",gid,{groupIds:[...new Set([...cur,S.groupId])]}); toast("Gymnaste ajouté au groupe"); go("gymnastes"); return; }
  if(f.id==="profileForm"){ const bdns=$("#pfBdns").value.replace(/\D/g,"").slice(0,12); document.activeElement.blur(); call("/api/auth/profile","POST",{bdns}).then(r=>{ if(r.ok){ S.me=r.d.user; saveCache(); toast("Profil enregistré"); render(); pull(); } else toast("Enregistrement impossible"); }); return; }
  if(f.id==="pwForm"){ const current=$("#pwCur").value, next=$("#pwNew").value; document.activeElement.blur(); call("/api/auth/password","POST",{current,next}).then(r=>{ toast(r.ok?"Mot de passe modifié":r.d.error==="invalid"?"Mot de passe actuel incorrect":"Le nouveau mot de passe doit faire 10 caractères minimum"); if(r.ok) render(); }); return; }
  if(f.id==="newClubForm"){ const v=$("#newClubIn").value.trim().slice(0,60); $("#newClubIn").blur(); if(v){ store.set("clubs",uid(),{name:v}); } return; }
  if(f.dataset.newgroup){ const inp=f.querySelector("input"); const v=inp.value.trim().slice(0,60); inp.blur(); if(v){ const gid=uid(); store.set("groups",gid,{name:v,clubId:f.dataset.newgroup,apps:["sol"]}); toast("Groupe créé"); } return; }
  if(f.id==="planForm"){ S.planEngins=[...document.querySelectorAll("[data-pe]")].filter(x=>x.checked).map(x=>x.dataset.pe); S.planFree=$("#pFree").value; const free=S.planFree.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(.*?)[\s:;,-]+(\d{1,3})\s*(min)?$/i); return m?{t:m[1].trim().slice(0,40)||"Bloc libre",min:Math.min(180,+m[2])}:{t:l.slice(0,40),min:10}; });
    S.plan=buildPlan({engins:S.planEngins,free,date:$("#pDate").value,start:$("#pStart").value||"18:00",dur:+$("#pDur").value||90,warm:+$("#pWarm").value||0,cool:+$("#pCool").value||0,rot:+$("#pRot").value||0,coaches:[...document.querySelectorAll("[data-coach]")].filter(x=>x.checked).map(x=>x.dataset.coach)}); go("seance","nouvelle"); }
});
document.addEventListener("input",e=>{ if(e.target.dataset&&e.target.dataset.ed&&S.ed){ S.ed.d[e.target.dataset.ed]=e.target.dataset.list?e.target.value.split("\n"):e.target.value; return; } if(e.target.id==="bibQ"){ S.bibQ=e.target.value; clearTimeout(S._qt); S._qt=setTimeout(()=>{ const pos=e.target.selectionStart; const keep=document.activeElement===e.target; e.target.blur(); render(); const el=$("#bibQ"); if(el&&keep){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(x){} } },250); } });
window.addEventListener("hashchange",()=>{ window.scrollTo(0,0); if(location.hash==="#gymnastes--admin") S.admin=null; if(location.hash==="#gymnastes--tableau") S.tOrd=null; if(!location.hash.startsWith("#biblio--edit-")) S.ed=null; render(); });

/* ---------- démarrage ---------- */
(()=>{ const c=LS.get("getuma-cache",null); if(c&&S.me){ Object.assign(S,{content:c.content||{},clubs:c.clubs||{},groups:c.groups||{},gymnasts:c.gymnasts||{},sessions:c.sessions||{},attendance:c.attendance||{},members:c.members||{}}); S.mode="shared"; } for(const op of OUTBOX) applyLocal(op); })();
if(!S.me) S.mode="login";
render();
if(navigator.onLine) call("/api/auth/me","GET").then(r=>{ if(r.status===401){ wipeLocal(); toLogin(); } else if(r.ok){ S.me=r.d.user; if(S.mode==="login") S.mode="loading"; saveCache(); render(); pull(); } }).catch(()=>{});
setInterval(()=>{ if(document.visibilityState==="visible") pull(); },60000); /* 60 s : économise le quota de lectures */
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pull(); });
window.addEventListener("online",()=>{ render(); pull(); });
window.addEventListener("offline",render);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
