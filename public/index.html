.st1{background:var(--s1);color:var(--s1i)} .st2{background:var(--s2);color:var(--s2i)} .st3{background:var(--s3);color:var(--s3i)} .st4{background:var(--s4);color:var(--s4i)}
.pick{display:flex;gap:4px;flex-shrink:0}
.pick button{min-width:38px;height:38px;border-radius:6px;font-weight:600;font-size:14px;color:var(--muted);border:1px solid var(--line)}
.pick button[aria-pressed="true"].p0{background:var(--hover);color:var(--ink);border-color:var(--muted)}
.pick button[aria-pressed="true"].p1{background:var(--s1);color:var(--s1i);border-color:transparent}
.pick button[aria-pressed="true"].p2{background:var(--s2);color:var(--s2i);border-color:transparent}
.pick button[aria-pressed="true"].p3{background:var(--s3);color:var(--s3i);border-color:transparent}
.pick button[aria-pressed="true"].p4{background:var(--s4);color:var(--s4i);border-color:transparent}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend .st{min-width:22px;height:22px;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.b3{background:var(--s3i)} .b4{background:var(--s4)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1 1 0;min-width:0;max-width:180px;text-align:center;padding:9px 0 11px;color:var(--muted);text-decoration:none;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;display:grid;gap:2px;justify-items:center}
.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.tabs a[aria-current="page"]{color:var(--ink)}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:15px;padding:6px 0}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--soft);border-radius:8px}
.banner{background:var(--s1);color:var(--s1i);padding:8px 12px;border-radius:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:60;font-size:14px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(15,15,15,.4);z-index:50;display:grid;place-items:center;padding:16px}
.modal>section{background:var(--bg);border-radius:10px;padding:20px;width:min(400px,100%);display:grid;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:4px}
.tl{display:grid;gap:14px}
.tl .slot{display:grid;grid-template-columns:56px 1fr;gap:10px}
.tl time{font-weight:600;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;padding:1px 6px;border-radius:4px;background:var(--hover);color:var(--muted);margin-right:4px}
svg.ch text{fill:var(--muted);font:11px var(--font)}
.nm{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function progress(g){ const els=elements().filter(e=>forGym(e,g)&&!e.x); const done=els.filter(e=>effSt(g,e.id)>=3).length; return {done,total:els.length,pct:els.length?Math.round(done/els.length*100):0}; }
function workGroups(list,max){ const b={},free=[]; for(const g of list){ const n=needs(g).filter(x=>x.ready); if(!n.length){ free.push(g); continue; } (b[n[0].e.id]=b[n[0].e.id]||[]).push(g); } const out=[]; for(const [eid,l] of Object.entries(b)) for(let i=0;i<l.length;i+=max) out.push({eid,gyms:l.slice(i,i+max)}); out.sort((a,b)=>b.gyms.length-a.gyms.length||minCat(BY[a.eid])-minCat(BY[b.eid])); if(free.length) out.push({eid:null,gyms:free}); return out; }

function buildPlan(o){
  const po=presentOnly(gyms(),o.date); const list=po.list; const t0=toMin(o.start); const coaches=o.coaches;
  const engins=(o.engins&&o.engins.length?o.engins:[S.engin]); const free=o.free||[]; const freeMin=free.reduce((s,f)=>s+f.min,0);
  const main=Math.max(10*engins.length,o.dur-o.warm-o.cool-freeMin); const per=Math.max(10,Math.floor(main/engins.length/5)*5||Math.floor(main/engins.length));
  const blocks=[]; let t=t0; const prev=S.engin;
  if(o.warm){ blocks.push({t:toHM(t),dur:o.warm,title:"Échauffement",detail:"Mobilisation, poignets, gainage I / C+ / C−, appuis.",stations:[]}); t+=o.warm; }
  engins.forEach((eng,k)=>{ S.engin=eng; const d=k===engins.length-1?main-per*(engins.length-1):per;
    const stations=workGroups(list,S.maxSize).map((w,i)=>({eid:w.eid,names:w.gyms.map(g=>g.name+(po.a&&presNote(po.a,g)?` (${presNote(po.a,g)})`:"")),coach:coaches.length?coaches[i%coaches.length]:"",postes:w.eid?postesFor(w.eid):["Perfectionnement ou préparation physique"]}));
    blocks.push({t:toHM(t),dur:d,engin:eng,title:`${enginName(eng)} : groupes de besoin`,detail:o.rot?`Chaque groupe enchaîne ses ateliers et change toutes les ${o.rot} min. Termine par l'élément complet.`:"Chaque groupe enchaîne ses ateliers et termine par l'élément complet.",stations}); t+=d; });
  S.engin=prev;
  free.forEach(f=>{ blocks.push({t:toHM(t),dur:f.min,title:f.t,detail:"Bloc libre",stations:[]}); t+=f.min; });
  if(o.cool) blocks.push({t:toHM(t),dur:o.cool,title:"Retour au calme",detail:"Souplesse active, bilan rapide.",stations:[]});
  return {...o,groupId:S.groupId,apps:engins,blocks,created:new Date().toISOString()};
}

function exportBdns(){
  const date=S.presDate||today(); const month=date.slice(0,7); const gr=S.groups[S.groupId]||{};
  const coachMap={}; (S.members[gr.clubId]||[]).forEach(m=>{ if(typeof m!=="string") coachMap[m.name]=m.bdns||""; });
  const fmt=d=>d.split("-").reverse().join(".");
  const rows=[["N° PERSONNEL","FONCTION","DATE","TYPE D'ACTIVITE","HEURE","DUREE","LIEU"]]; const missing=new Set();
  const sessions=Object.values(S.attendance).filter(x=>x.groupId===S.groupId&&String(x.date).startsWith(month)).sort((a,b)=>a.date.localeCompare(b.date));
  for(const s of sessions){
    for(const [name,on] of Object.entries(s.coaches||{})){ if(!on) continue; const n=coachMap[name]; if(!n){ missing.add(name); continue; } rows.push([n,"Moniteur",fmt(s.date),"Entraînement",s.start||"",String(s.dur||""),s.lieu||""]); }
    for(const [gid,on] of Object.entries(s.present||{})){ if(!on) continue; const g=S.gymnasts[gid]; if(!g) continue; if(!g.bdns){ missing.add(g.name); continue; } rows.push([g.bdns,"Participant",fmt(s.date),"Entraînement",s.start||"",String(s.dur||""),s.lieu||""]); }
  }
  if(rows.length===1){ S.csvWarn="Aucune présence avec N° BDNS ce mois-ci."; S.lastCsv=""; render(); return; }
  const csv=rows.map(r=>r.map(v=>/[;"\n]/.test(v)?`"${String(v).replace(/"/g,'""')}"`:v).join(";")).join("\r\n");
  S.lastCsv=csv; S.csvWarn=missing.size?`Ignorés faute de N° BDNS : ${[...missing].join(", ")}`:"";
  try{ const b=new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}); const u=URL.createObjectURL(b); const l=document.createElement("a"); l.href=u; l.download=`presences-${(gr.name||"groupe").replace(/[^\w-]+/g,"_")}-${month}.csv`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000); }catch(e){}
  render();
}

function sortVal(g,k){
  const [pr,nm]=splitName(g);
  if(k==="prenom") return norm(pr+" "+nm); if(k==="nom") return norm((nm||"~")+" "+pr);
  if(k==="age"||k==="naissance"){ if(g.naissance) return -Date.parse(g.naissance); const y=yearOf(g); return y?-Date.parse(y+"-07-01"):null; } /* plus jeune = plus petit âge */
  if(k==="cat") return CATS.indexOf(g.cat); if(k==="prog") return progress(g).pct;
  if(k==="besoin") return needs(g).filter(x=>x.ready).length;
  return norm(g[k]||"")||null;
}
function sortGyms(list,k=S.gsort.k,d=S.gsort.d){
  return list.map(g=>({g,v:sortVal(g,k),t:norm(splitName(g).join(" "))})).sort((a,b)=>{
    if(a.v===null&&b.v!==null) return 1; if(b.v===null&&a.v!==null) return -1; /* vides toujours à la fin */
    const c=typeof a.v==="number"?a.v-b.v:String(a.v||"").localeCompare(String(b.v||""),"fr",{numeric:true});

function treeLayout(all){

async function uploadMedia(file){
  if(!navigator.onLine){ toast("Pas de réseau : envoi impossible"); return; }
  let f=file;
  if(/^image\/(jpeg|png|webp)$/.test(f.type)) f=await shrink(f).catch(()=>file);
  if(f.size>100*1024*1024){ toast("Fichier trop lourd (100 Mo max). Mets la vidéo sur YouTube et colle le lien."); return; }
  const EXT={"image/jpeg":"jpg","image/png":"png","image/webp":"webp","image/gif":"gif","video/mp4":"mp4","video/webm":"webm","video/quicktime":"mov"};
  if(!EXT[f.type]){ toast("Format non pris en charge"); return; }
  S.upl=true; render();
  if(f.size>4*1024*1024){ /* gros fichier : envoi direct vers le stockage privé, en plusieurs morceaux */
    try{ const {upload}=await import("/vendor/blob-client.js"); const key=`${crypto.randomUUID()}.${EXT[f.type]}`;
      await upload(`media/${key}`,f,{access:"private",handleUploadUrl:"/api/media/upload",contentType:f.type,multipart:f.size>20*1024*1024});
      if(S.ed) S.ed.d.media.push({url:`/api/media?k=${key}`,type:f.type.startsWith("video")?"video":"img",cap:($("#edCap")||{}).value||""}); toast("Fichier ajouté");
    }catch(e){ console.error(e); toast("Envoi impossible. Réessaie ou passe par un lien YouTube."); }
    finally{ S.upl=false; render(); }
    return;
  }
  try{ const fd=new FormData(); fd.append("file",f,f.name||"media"); const r=await fetch("/api/media",{method:"POST",body:fd,headers:{"x-getuma":"1"},credentials:"same-origin"}); const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.url){ toast(r.status===415?"Format non pris en charge":r.status===413?"Fichier trop lourd (4 Mo max)":"Envoi impossible"); return; }
    if(S.ed){ S.ed.d.media.push({url:j.url,type:j.type,cap:($("#edCap")||{}).value||""}); } toast("Fichier ajouté");
  } finally{ S.upl=false; render(); }
}
function shrink(file){ return new Promise((ok,ko)=>{ const img=new Image(); const u=URL.createObjectURL(file); img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)); if(k===1&&file.size<1.5e6){ URL.revokeObjectURL(u); ok(file); return; } const c=document.createElement("canvas"); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext("2d").drawImage(img,0,0,c.width,c.height); c.toBlob(b=>{ URL.revokeObjectURL(u); b?ok(new File([b],"photo.jpg",{type:"image/jpeg"})):ko(); },"image/jpeg",0.85); }; img.onerror=()=>{ URL.revokeObjectURL(u); ko(); }; img.src=u; }); }

function chart(g){
  /* éléments acquis (et maîtrisés) à la fin de chaque mois, tous engins confondus */
  const log=Object.entries(g.log||{}).map(([k,v])=>({k,...v})).filter(l=>BY[l.e]&&l.d).sort((a,b)=>(a.d+a.k).localeCompare(b.d+b.k));
  Object.entries(g.st||{}).forEach(([e,v])=>{ if(v&&v.d&&BY[e]&&!log.some(l=>l.e===e)) log.push({e,s:v.s,d:v.d,k:""}); }); log.sort((a,b)=>(a.d+a.k).localeCompare(b.d+b.k));
  if(!log.length) return "";
  const m0=log[0].d.slice(0,7), now=today().slice(0,7); const months=[]; let [y,m]=m0.split("-").map(Number);
  while(`${y}-${String(m).padStart(2,"0")}`<=now){ months.push(`${y}-${String(m).padStart(2,"0")}`); m++; if(m>12){ m=1; y++; } }
  const ms=months.slice(-12); const cur={}; let i=0; const pts=[];
  for(const mo of months){ while(i<log.length&&log[i].d.slice(0,7)<=mo){ cur[log[i].e]=log[i].s; i++; } if(ms.includes(mo)){ const v=Object.values(cur); pts.push({mo,ok:v.filter(s=>s>=3).length,top:v.filter(s=>s===4).length}); } }
  const W=600,H=170,P=26,max=Math.max(4,...pts.map(p=>p.ok)); const bw=(W-2*P)/pts.length;
  const mn=mo=>new Date(mo+"-15").toLocaleDateString("fr-CH",{month:"short"}).replace(".","");
  return `<section class="card"><h2><span aria-hidden="true">📈</span>Progression mois par mois</h2>
   <svg class="ch" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Éléments acquis par mois">
   ${pts.map((p,j)=>{ const x=P+j*bw+bw*.18, w=bw*.64, h1=p.ok/max*(H-2*P-10), h2=p.top/max*(H-2*P-10); return `<rect x="${x}" y="${H-P-h1}" width="${w}" height="${h1}" rx="3" fill="var(--s3)"/><rect x="${x}" y="${H-P-h2}" width="${w}" height="${h2}" rx="3" fill="var(--s4)"/><text x="${x+w/2}" y="${H-P-h1-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${p.ok||""}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${mn(p.mo)}</text>`; }).join("")}
   <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/></svg>
   <span class="xs muted">Nombre d'éléments acquis à la fin de chaque mois (vert foncé : maîtrisés), tous engins.</span></section>`;
}

let SW=null;

document.addEventListener("touchend",()=>{ if(!SW) return; const {r,dx}=SW; SW=null; r.style.transform=""; r.classList.remove("swr","swl"); if(Math.abs(dx)<60) return;

  if(f.id==="signupForm"){ const name=$("#suName").value.trim(), email=$("#suEmail").value.trim(), password=$("#suPw").value; document.activeElement.blur(); S.authErr=""; call("/api/auth/signup","POST",{name,email,password}).then(r=>{ if(r.ok){ if(r.d.user.status==="active"){ wipeLocal(); S.me=r.d.user; S.mode="loading"; saveCache(); render(); pull(); } else { S.authView="pending"; render(); } } else { S.authErr=r.d.error==="exists"?"Un compte existe déjà avec cet e-mail.":r.d.error==="password"?"Le mot de passe doit faire au moins 10 caractères.":r.d.error==="email"?"E-mail invalide.":"Création impossible pour le moment."; render(); } }).catch(()=>{ S.authErr="Pas de réseau."; render(); }); return; }
  if(f.id==="pasteForm"){ const rows=$("#pasteIn").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean); $("#pasteIn").blur(); let n=0; (async()=>{ for(const l of rows.slice(0,100)){ const c=l.split(/\t|;/).map(x=>x.trim()); if(!c[0]&&!c[1]) continue; if(/pr[ée]nom/i.test(c[0])) continue; const [prenom="",nom="",naiss="",cat="",fsg="",bdns0="",adresse0="",tel10="",tel20=""]=c; const [bdns,adresse,tel1,tel2]=S.extra?[bdns0,adresse0,tel10,tel20]:["","","",""]; const yr=/^\d{4}$/.test(naiss)?naiss:(toIsoDate(naiss)||"").slice(0,4); const catOk=/^C[1-7]$/i.test(cat)?cat.toUpperCase():"C1"; await store.set("gymnasts",uid(),{name:`${prenom} ${nom}`.trim().slice(0,60)||"Sans nom",prenom:prenom.slice(0,60),nom:nom.slice(0,60),naissance:S.extra?toIsoDate(naiss):"",annee:yr,cat:catOk,fsg:fsg.replace(/\D/g,"").slice(0,12),bdns:bdns.replace(/\D/g,"").slice(0,12),adresse:adresse.slice(0,120),tel1:tel1.slice(0,30),tel2:tel2.slice(0,30),groupIds:[S.groupId],groupId:S.groupId,st:{},log:{},created:today()}); n++; } toast(`${n} gymnaste(s) importé(s)`); })(); return; }
  if(f.id==="linkForm"){ const gid=$("#linkSel").value; const cur=gGroups(S.gymnasts[gid]); store.patch("gymnasts",gid,{groupIds:[...new Set([...cur,S.groupId])]}); toast("Gymnaste ajouté au groupe"); go("gymnastes"); return; }
  if(f.id==="profileForm"){ const bdns=$("#pfBdns").value.replace(/\D/g,"").slice(0,12); document.activeElement.blur(); call("/api/auth/profile","POST",{bdns}).then(r=>{ if(r.ok){ S.me=r.d.user; saveCache(); toast("Profil enregistré"); render(); pull(); } else toast("Enregistrement impossible"); }); return; }
  if(f.id==="pwForm"){ const current=$("#pwCur").value, next=$("#pwNew").value; document.activeElement.blur(); call("/api/auth/password","POST",{current,next}).then(r=>{ toast(r.ok?"Mot de passe modifié":r.d.error==="invalid"?"Mot de passe actuel incorrect":"Le nouveau mot de passe doit faire 10 caractères minimum"); if(r.ok) render(); }); return; }
  if(f.id==="newClubForm"){ const v=$("#newClubIn").value.trim().slice(0,60); $("#newClubIn").blur(); if(v){ store.set("clubs",uid(),{name:v}); } return; }
  if(f.dataset.newgroup){ const inp=f.querySelector("input"); const v=inp.value.trim().slice(0,60); inp.blur(); if(v){ const gid=uid(); store.set("groups",gid,{name:v,clubId:f.dataset.newgroup,apps:["sol"]}); toast("Groupe créé"); } return; }
  if(f.id==="planForm"){ S.planEngins=[...document.querySelectorAll("[data-pe]")].filter(x=>x.checked).map(x=>x.dataset.pe); S.planFree=$("#pFree").value; const free=S.planFree.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{ const m=l.match(/^(.*?)[\s:;,-]+(\d{1,3})\s*(min)?$/i); return m?{t:m[1].trim().slice(0,40)||"Bloc libre",min:Math.min(180,+m[2])}:{t:l.slice(0,40),min:10}; });
    S.plan=buildPlan({engins:S.planEngins,free,date:$("#pDate").value,start:$("#pStart").value||"18:00",dur:+$("#pDur").value||90,warm:+$("#pWarm").value||0,cool:+$("#pCool").value||0,rot:+$("#pRot").value||0,coaches:[...document.querySelectorAll("[data-coach]")].filter(x=>x.checked).map(x=>x.dataset.coach)}); go("seance","nouvelle"); }
});
document.addEventListener("input",e=>{ if(e.target.id==="etQ"){ S.etQ=e.target.value; clearTimeout(S._etq); S._etq=setTimeout(()=>{ const el=e.target; const pos=el.selectionStart; el.blur(); render(); const n=$("#etQ"); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(x){} } },300); return; } if(e.target.dataset&&e.target.dataset.ed&&S.ed){ S.ed.d[e.target.dataset.ed]=e.target.type==="checkbox"?e.target.checked:e.target.dataset.list?e.target.value.split("\n"):e.target.value; return; } if(e.target.id==="bibQ"){ S.bibQ=e.target.value; clearTimeout(S._qt); S._qt=setTimeout(()=>{ const pos=e.target.selectionStart; const keep=document.activeElement===e.target; e.target.blur(); render(); const el=$("#bibQ"); if(el&&keep){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(x){} } },250); } });
window.addEventListener("hashchange",()=>{ window.scrollTo(0,0); if(location.hash==="#gymnastes--admin") S.admin=null; if(location.hash==="#gymnastes--tableau") S.tOrd=null; if(!location.hash.startsWith("#biblio--edit-")) S.ed=null; render(); });

/* ---------- démarrage ---------- */
(()=>{ const c=LS.get("getuma-cache",null); if(c&&S.me){ Object.assign(S,{content:c.content||{},clubs:c.clubs||{},groups:c.groups||{},gymnasts:c.gymnasts||{},sessions:c.sessions||{},attendance:c.attendance||{},members:c.members||{}}); S.mode="shared"; } for(const op of OUTBOX) applyLocal(op); })();
if(!S.me) S.mode="login";
render();
if(navigator.onLine) call("/api/auth/me","GET").then(r=>{ if(r.status===401){ wipeLocal(); toLogin(); } else if(r.ok){ S.me=r.d.user; if(S.mode==="login") S.mode="loading"; saveCache(); render(); pull(); } }).catch(()=>{});
setInterval(()=>{ if(document.visibilityState==="visible") pull(); },60000); /* 60 s : économise le quota de lectures */
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible") pull(); });
window.addEventListener("online",()=>{ render(); pull(); });
window.addEventListener("offline",render);
if("serviceWorker" in navigator) window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
</script>
</body>
